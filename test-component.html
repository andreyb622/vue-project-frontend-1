<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Select Component Test</title>
    <script src="https://unpkg.com/vue@next"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="app">
        <div class="max-w-md mx-auto p-8 space-y-6">
            <h1 class="text-2xl font-bold">Custom Select Test</h1>
            
            <!-- Single Select -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Single Select</label>
                <select v-model="singleValue" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                    <option value="">Select an option...</option>
                    <option v-for="option in options" :key="option.id" :value="option">{{ option.value }}</option>
                </select>
                <p class="mt-2 text-sm text-gray-600">Selected: {{ singleValue ? singleValue.value : 'None' }}</p>
            </div>
            
            <!-- Multi Select Simulation -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Multi Select (Checkboxes)</label>
                <div class="space-y-2">
                    <label v-for="option in options" :key="option.id" class="flex items-center">
                        <input type="checkbox" :value="option" v-model="multiValue" class="mr-2">
                        {{ option.value }}
                    </label>
                </div>
                <p class="mt-2 text-sm text-gray-600">
                    Selected: {{ multiValue.length > 0 ? multiValue.map(o => o.value).join(', ') : 'None' }}
                </p>
            </div>
            
            <!-- Search Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Search</label>
                <input 
                    v-model="searchQuery" 
                    type="text" 
                    placeholder="Search options..."
                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                >
                <div v-if="searchQuery" class="mt-2">
                    <p class="text-sm text-gray-600">Filtered options:</p>
                    <ul class="mt-1 space-y-1">
                        <li v-for="option in filteredOptions" :key="option.id" class="text-sm">
                            {{ option.value }}
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;

        createApp({
            setup() {
                const options = ref([
                    { id: '1', value: 'Apple' },
                    { id: '2', value: 'Banana' },
                    { id: '3', value: 'Cherry' },
                    { id: '4', value: 'Date' },
                    { id: '5', value: 'Elderberry' }
                ]);

                const singleValue = ref(null);
                const multiValue = ref([]);
                const searchQuery = ref('');

                const filteredOptions = computed(() => {
                    if (!searchQuery.value) return options.value;
                    return options.value.filter(option =>
                        option.value.toLowerCase().includes(searchQuery.value.toLowerCase())
                    );
                });

                return {
                    options,
                    singleValue,
                    multiValue,
                    searchQuery,
                    filteredOptions
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
